# Docker Compose runs several containers together, described in one file.
# We need two: a Postgres database and our API.
#
#   Start:  docker compose up --build
#   Stop:   docker compose down        (add -v to also delete the database data)

services:
  # ---- Service 1: the database ----
  db:
    image: postgres:17-alpine          # a ready-made image from Docker Hub, nothing to build
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory
    ports:
      - "5433:5432"                    # host:container, so you can connect from pgAdmin on 5433
    volumes:
      - pgdata:/var/lib/postgresql/data   # keeps the data when the container is removed
    healthcheck:                       # lets Compose know when Postgres is actually ready
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory"]
      interval: 5s
      retries: 10

  # ---- Service 2: our API ----
  api:
    build: .                           # build an image from the Dockerfile in this folder
    environment:
      PORT: 5000
      # "db" is the service name above. Inside Compose, containers reach
      # each other by service name, and Postgres listens on 5432 there.
      DATABASE_URL: postgres://postgres:postgres@db:5432/inventory
    ports:
      - "5000:5000"                    # http://localhost:5000 on your machine
    depends_on:
      db:
        condition: service_healthy     # don't start until the database is ready

volumes:
  pgdata:
